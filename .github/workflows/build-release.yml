name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger when pushing tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka ordered-set zstandard

    - name: Cache Nuitka downloads
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka
        key: nuitka-cache-windows-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          nuitka-cache-windows-
    
    - name: Build executable with Nuitka
      run: |
        .\compile.bat
      shell: cmd
      
    - name: Verify build output
      run: |
        if (-Not (Test-Path "build/LpkUnpackerGUI.exe")) {
          Write-Error "Build failed: build/LpkUnpackerGUI.exe not found"
          exit 1
        }
        Write-Host "Build successful!"
    
    - name: Package build output
      id: package
      run: |
        if ("${{ github.ref }}" -match '^refs/tags/(.+)$') {
          $version = $matches[1]
        } else {
          $version = "${{ github.sha }}".Substring(0, 7)
        }
        $zipName = "LpkUnpacker-$version-windows-x64.zip"
        Compress-Archive -Path "build/LpkUnpackerGUI.exe" -DestinationPath $zipName -CompressionLevel Optimal
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-binary
        path: ${{ steps.package.outputs.ZIP_NAME }}

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 libdbus-1-3
        # For Nuitka
        sudo apt-get install -y build-essential python3-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka ordered-set zstandard

    - name: Cache Nuitka downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/Nuitka
        key: nuitka-cache-linux-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          nuitka-cache-linux-
    
    - name: Build executable with Nuitka
      run: |
        python -m nuitka --onefile \
            --enable-plugin=pyqt5 \
            --output-dir=build \
            --jobs=$(nproc) \
            --lto=no \
            --show-progress \
            --include-data-dir=./GUI/assets=GUI/assets \
            --include-data-dir=./Translations/locales=Translations/locales \
            --include-data-dir=./Img=Img \
            --nofollow-import-to=matplotlib,scipy,pandas,tkinter \
            --python-flag=no_site \
            --python-flag=no_docstrings \
            --assume-yes-for-downloads \
            --remove-output \
            LpkUnpackerGUI.py
      
    - name: Verify build output
      run: |
        if [ ! -f "build/LpkUnpackerGUI.bin" ] && [ ! -f "build/LpkUnpackerGUI" ]; then
          echo "Build failed: output not found"
          exit 1
        fi
        # Nuitka might name it LpkUnpackerGUI or LpkUnpackerGUI.bin
        [ -f "build/LpkUnpackerGUI.bin" ] && mv build/LpkUnpackerGUI.bin build/LpkUnpackerGUI
        chmod +x build/LpkUnpackerGUI
    
    - name: Package build output
      id: package
      run: |
        if [[ "${{ github.ref }}" =~ ^refs/tags/(.+)$ ]]; then
          version=${BASH_REMATCH[1]}
        else
          version=$(echo "${{ github.sha }}" | cut -c1-7)
        fi
        zip_name="LpkUnpacker-$version-linux-x64.tar.gz"
        tar -czf $zip_name -C build LpkUnpackerGUI
        echo "ZIP_NAME=$zip_name" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64-binary
        path: ${{ steps.package.outputs.ZIP_NAME }}

  release:
    name: Create Release
    needs: [build_windows, build_linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-x64-binary

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-x64-binary

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LpkUnpacker-*-windows-x64.zip
          LpkUnpacker-*-linux-x64.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release
      # Only create release for tag pushes, not manual workflow runs
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        bodyFile: RELEASE_NOTES.md
        artifacts: LpkUnpacker-*.zip
        artifactContentType: application/zip
        draft: true
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          *.log
        retention-days: 7
